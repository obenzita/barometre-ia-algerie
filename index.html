<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
<meta name="theme-color" content="#0D1024">
<title>Baromètre IA Algérie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: an investigation file. Ink frame, the network drawn as an evidence board,
   facts on paper sheets. One highlighter colour marks only what the visitor selected. */
:root{
  /* Benzita brand (benzita.com design system, sampled 2026-09-14) */
  --blue:#0150C9; --blue-hi:#1B63DC; --blue-deep:#00339E; --navy:#171B31; --navy-2:#1F2442; --navy-3:#2A3159;
  --amber:#F9C846; --tint:#E9EFFB; --tint-amber:#FDF4DC;
  /* surfaces and ink (light) */
  --ink:#0D1024; --ink-2:#161A33; --ink-3:#212748; --rule:#2A3157;
  --chalk:#F2F5FB; --chalk-dim:#A3AFCB;
  --paper:#161A33; --paper-2:#262C50; --paper-ink:#F2F5FB; --paper-dim:#A3AFCB;
  --mark:#F9C846; --mark-ink:#3A2C00;
  /* data series */
  --gpt:#2EE6A6; --gem:#F472D0; --fr:#FFE066; --ar:#FF7A59;
  --gpt-d:#2EE6A6; --gem-d:#F472D0; --fr-d:#FFE066; --ar-d:#FF7A59;
  --low:#8E9AA3;
  --f-sans:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-ar:"Noto Naskh Arabic","Geeza Pro","Arial",serif;
  /* system */
  --r:8px; --r-lg:10px; --r-btn:6px;
  --shadow:0 18px 40px rgba(0,0,0,.35); --shadow-sm:0 2px 10px rgba(0,0,0,.25);
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
.board,.board-wrap.fs,.fs-bar{--ink:#0D1024; --ink-2:#121630; --ink-3:#212748; --rule:#2A3157; --chalk:#F2F5FB; --chalk-dim:#A3AFCB}
html,body{background:var(--ink);color:var(--chalk)}
body{font-family:var(--f-sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
[lang="ar"]{font-family:var(--f-ar);unicode-bidi:isolate;line-height:1.7}
.ar-block{direction:rtl;text-align:right;font-size:1.08em}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brandmark{font-weight:800;font-variation-settings:"wdth" 72;font-size:20px;letter-spacing:.01em;text-decoration:none;white-space:nowrap}
.brandmark span{color:var(--chalk-dim);font-weight:500}
.nav{display:none;gap:4px;margin-left:auto}
.nav a{text-decoration:none;padding:6px 12px;border-radius:999px;color:var(--chalk-dim)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--chalk)}
.lang{margin-left:auto;display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:4px 10px;font-size:13px;color:var(--chalk-dim)}
.lang button[aria-pressed="true"]{background:var(--chalk);color:var(--ink);font-weight:700}
.banner{display:none;background:var(--mark);color:var(--mark-ink);font-size:13px}
.banner .wrap{padding-block:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.banner b{font-weight:800}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink-2);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav a{text-decoration:none;text-align:center;padding:10px 4px 12px;font-size:12px;color:var(--chalk-dim);display:flex;flex-direction:column;align-items:center;gap:3px}
.bnav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.bnav a[aria-current="page"]{color:var(--mark)}
@media (min-width:900px){
  .nav{display:flex}
  .lang{margin-left:12px}
  .bnav{display:none}
  body{padding-bottom:0}
}
main{padding-block:20px 48px}
h1,h2,h3{font-variation-settings:"wdth" 75;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6.4vw,58px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(22px,3.6vw,30px);font-weight:750}
h3{font-size:18px;font-weight:700}
p{margin:0}
.lede{color:var(--chalk-dim);max-width:60ch;margin-top:12px;font-size:16px}
.section{margin-top:40px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hint{color:var(--chalk-dim);font-size:13px}
/* counters */
.counters{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-top:22px}
.counter{background:var(--ink-2);padding:12px 14px}
.counter b{display:block;font-size:28px;font-weight:800;font-variation-settings:"wdth" 70;font-variant-numeric:tabular-nums;line-height:1.05}
.counter span{color:var(--chalk-dim);font-size:12.5px}
.counter.wide{grid-column:1/-1}
@media (min-width:600px){.counters{grid-template-columns:repeat(5,1fr)}.counter.wide{grid-column:auto}}
.stamp{font-size:12.5px;color:var(--chalk-dim);margin-top:8px}
/* search */
.search{position:relative;margin-top:22px}
.search label{display:block;font-weight:700;margin-bottom:6px}
.search input{width:100%;background:var(--paper);color:var(--paper-ink);border:0;border-radius:var(--r);padding:14px 16px;font-size:17px}
.search input::placeholder{color:var(--paper-dim)}
.results{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--paper);color:var(--paper-ink);border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.45);z-index:15;max-height:340px;overflow:auto}
.results button{display:flex;width:100%;justify-content:space-between;gap:12px;background:none;border:0;border-bottom:1px solid var(--paper-2);padding:11px 14px;text-align:left}
.results button:hover,.results button:focus-visible{background:var(--paper-2)}
.results small{color:var(--paper-dim)}
/* home: case files */
.home-grid{display:grid;gap:16px;margin-top:8px}
@media (min-width:1000px){.home-grid{grid-template-columns:300px 1fr}}
.files{display:flex;flex-direction:column;gap:8px}
.file{position:relative;text-align:left;background:var(--ink-2);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px 12px 16px;color:var(--chalk)}
.file .tag{font-size:12px;color:var(--chalk-dim)}
.file h3{font-size:16px;margin-top:2px;font-variation-settings:"wdth" 88}
.sheet{background:var(--paper);color:var(--paper-ink);border-radius:var(--r);padding:18px}
.sheet .kicker{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--paper-dim)}
.prov{border:1.5px solid var(--paper-ink);border-radius:3px;padding:1px 6px;font-weight:700;color:var(--paper-ink);font-size:11.5px}
.sheet h2{margin-top:8px;color:var(--paper-ink)}
.sheet .body{margin-top:8px;color:var(--paper-dim);max-width:62ch}
.sheet .go{display:inline-flex;margin-top:14px;background:var(--paper-ink);color:var(--paper);border:0;border-radius:999px;padding:9px 16px;font-weight:600;text-decoration:none}
.chart{margin-top:14px;overflow-x:auto}
.chart svg{display:block;max-width:100%}
.mobile-files .sheet{margin-top:0}
.mobile-files{display:flex;flex-direction:column;gap:14px}
@media (min-width:1000px){.mobile-files{display:none}}
@media (max-width:999.98px){.desk-files{display:none}}
/* explorer */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:1px solid var(--rule);color:var(--chalk-dim);border-radius:999px;padding:8px 16px;font-weight:600}
.tab[aria-selected="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;flex-wrap:nowrap}
.seg button{background:none;border:0;border-right:1px solid var(--rule);padding:7px 11px;font-size:13.5px;color:var(--chalk-dim);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink-3);color:var(--chalk);font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:14px}
.controls .lbl{font-size:12.5px;color:var(--chalk-dim);display:block;margin-bottom:4px}
.conn{margin-top:18px}
.conn .seg{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
.conn .seg button{padding:10px 6px;white-space:normal;line-height:1.2}
@media (min-width:700px){.conn .seg{width:auto;display:inline-flex}}
.board-wrap{display:grid;gap:16px;margin-top:16px}
.seg button:disabled{cursor:not-allowed;opacity:.45}.seg button[aria-pressed="true"]:disabled{opacity:1}
.conn{display:flex;flex-wrap:wrap;gap:10px}
html.fs-on,html.fs-on body{overflow:hidden}
.board-wrap.fs{position:fixed;inset:0;z-index:35;margin:0;width:auto;background:var(--ink);overflow:auto;padding:0 16px 24px;align-content:start}
.board-wrap.fs .howto,.board-wrap.fs .hintrow{display:none!important}
.board-wrap.fs .legend{padding:4px 10px 0}
.board-wrap.fs .side .sheet{padding:14px 16px}.board-wrap.fs .side{font-size:14px}.board-wrap.fs .mini-list li{padding-bottom:3px}
@media (max-width:1399.98px){.fs-esc{display:none}.fs-bar .fs-x{margin-left:auto}.fs-bar .seg button{padding-inline:9px}.fs-bar{gap:8px 10px}}
@media (min-width:1000px){
 .board-wrap.fs{height:100vh;overflow:hidden;grid-template-rows:auto minmax(0,1fr);padding-bottom:12px}
 .board-wrap.fs > div:not(.fs-bar){display:flex;flex-direction:column;min-height:0;height:100%}
 .board-wrap.fs #board{flex:1;min-height:0;overflow:hidden}
  .board-wrap.fs .side{position:static;max-height:100%;overflow:auto;align-self:start}
}
.fs-bar{grid-column:1/-1;position:sticky;top:0;z-index:2;background:var(--ink);border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 0;margin-bottom:4px}
.fs-t{display:flex;flex-direction:column;line-height:1.2;margin-right:8px}.fs-t b{font-size:16px}.fs-t span{font-size:12px;color:var(--chalk-dim)}
.fs-esc{margin-left:auto;font-size:12px;color:var(--chalk-dim)}
@media (max-width:999.98px){.fs-esc{display:none}.board-wrap.fs{grid-template-columns:minmax(0,1fr);padding-bottom:140px}.fs-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.fs-bar .seg{grid-column:1/-1;max-width:100%;overflow-x:auto}.fs-x{grid-column:2;grid-row:1}}
@media (min-width:1000px){.board-wrap{grid-template-columns:minmax(0,1fr);align-items:start}.board-wrap.has-side{grid-template-columns:minmax(0,1fr) 360px}.board-wrap:not(.has-side) .side{display:none}}
.board{background:var(--ink-2);border:1px solid var(--rule);border-radius:var(--r);padding:12px 4px;min-width:0}
.board svg{display:block;width:100%}
.board text{fill:var(--chalk);font-size:13.5px;font-family:var(--f-sans)}
.board .sub{fill:var(--chalk-dim);font-size:11.5px}
.board .edge{fill:none;stroke:var(--chalk-dim);stroke-opacity:.22;transition:stroke-opacity .12s}
.board.has-sel .edge,.board.has-hov .edge{stroke-opacity:.05}
.board.has-hov .edge.hov{stroke:var(--chalk);stroke-opacity:.9}
.board.has-hov .node{opacity:.35}
.board.has-hov .node.hov{opacity:1}
.board.has-sel .edge.on{stroke:var(--mark);stroke-opacity:.95}
.board.has-sel.has-hov .edge.on{stroke-opacity:.35}
.board .node{cursor:pointer}
.board .node circle{fill:var(--ink);stroke:var(--chalk-dim);stroke-width:1.5}
.board .node .hit{fill:transparent;stroke:none}
.board.has-sel .node{opacity:.35}
.board.has-sel .node.on{opacity:1}
.board .node.sel circle{fill:var(--mark);stroke:var(--mark)}
.board .node.sel text{font-weight:800}
.board .off-mark{fill:var(--mark);font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--chalk-dim);padding:8px 10px 2px}
.legend svg{vertical-align:middle;margin-right:6px}
.side{display:flex;flex-direction:column;gap:12px}
@media (min-width:1000px){.side{position:sticky;top:80px}}
.side .sheet h3{color:var(--paper-ink)}
.mini-list{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.mini-list li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:baseline;border-bottom:1px solid var(--paper-2);padding-bottom:5px}
.empty{color:var(--chalk-dim);border:1px dashed var(--rule);border-radius:var(--r);padding:16px}
.ghost{background:none;border:1px solid var(--rule);color:var(--chalk);border-radius:999px;padding:7px 14px;font-size:13.5px}
/* values and n */
.v{font-weight:700;font-variant-numeric:tabular-nums}
.n{font-size:.78em;color:inherit;opacity:.62;font-variant-numeric:tabular-nums;margin-left:4px;white-space:nowrap}
.none{font-weight:500;font-style:italic;opacity:.6}
/* brand panel */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.6);z-index:40}
.panel{position:fixed;z-index:41;background:var(--paper);color:var(--paper-ink);left:0;right:0;bottom:0;top:max(48px,calc(env(safe-area-inset-top,0px) + 32px));border-radius:14px 14px 0 0;overflow:auto;overscroll-behavior:contain;padding:0 max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@keyframes inr{from{transform:translateX(24px);opacity:.4}}
@media (min-width:900px){.panel{left:auto;top:0;width:min(max(60vw,560px),1100px);border-radius:0;animation-name:inr;padding-top:env(safe-area-inset-top,0px)}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel-head{position:sticky;top:0;background:var(--paper);padding:16px 0 12px;display:flex;gap:12px;align-items:start;border-bottom:1px solid var(--paper-2);z-index:2}
.panel-head h2{color:var(--paper-ink)}
.panel-head .meta{font-size:13px;color:var(--paper-dim);margin-top:4px}
.panel-head .actions{margin-left:auto;display:flex;gap:8px}
.pbtn{background:var(--paper-2);border:0;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--paper-ink);white-space:nowrap}
.panel h3{margin-top:26px;color:var(--paper-ink)}
.panel .note{font-size:12.5px;color:var(--paper-dim);margin-top:4px;max-width:60ch}
.headline{margin-top:16px;font-size:17px;max-width:44ch}
.headline .v{font-size:30px;font-variation-settings:"wdth" 70;display:block;line-height:1.1}
.ptabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ptabs button{background:none;border:1px solid var(--paper-2);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--paper-dim)}
.ptabs button[aria-pressed="true"]{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}
.matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:1px;background:var(--paper-2);border:1px solid var(--paper-2);border-radius:var(--r);overflow:hidden;margin-top:10px}
.matrix>div{background:var(--paper);padding:10px 12px}
.matrix .hd{font-size:12.5px;color:var(--paper-dim);font-weight:600}
.matrix .cell .v{font-size:22px;font-variation-settings:"wdth" 75}
.matrix .cell .n{display:block;margin-left:0}
.matrix .all{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--paper-2)}
.eng{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.grid-days{margin-top:10px;overflow-x:auto}
.gd-row{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;padding:8px 0;border-bottom:1px solid var(--paper-2)}
.gd-row .need{font-size:13px;font-weight:600}
.gd-cells{display:grid;grid-template-columns:repeat(28,minmax(9px,1fr));gap:2px;min-width:280px}
.gd-c{height:18px;border-radius:2px;background:var(--paper-2);font-size:10px;line-height:18px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:var(--paper-ink)}
.gd-c.named{background:#B9C4CB}
.gd-c.first{background:var(--mark);color:var(--mark-ink)}
.gd-c.miss{background:repeating-linear-gradient(45deg,var(--paper-2) 0 3px,var(--paper) 3px 6px)}
.gd-c.future{background:transparent;outline:1px dashed var(--paper-2);outline-offset:-1px}
.gd-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--paper-dim);margin-top:10px}
.gd-key span{display:inline-flex;align-items:center;gap:5px}
.gd-key i{width:14px;height:12px;border-radius:2px;display:inline-block}
.pdetails summary{cursor:pointer;font-size:12.5px;color:var(--paper-dim)}
.domains-t{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.domains-t td,.domains-t th{border-bottom:1px solid var(--paper-2);padding:7px 4px;text-align:left}
.domains-t th{font-size:12px;color:var(--paper-dim);font-weight:600}
.domains-t .r{text-align:right}
.panel td,.panel th,.panel .v{color:var(--paper-ink)}.panel td .n,.panel .n{color:var(--paper-dim)}
.bp-top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-top:18px}
.bp-top .tabs{margin:0}
.bp-search{flex:1 1 280px;max-width:420px}
.bp-search > *{margin-top:0!important}
.bp-search .search label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.bp-search input{padding-block:9px}
.tab-n{font-size:11.5px;opacity:.6;font-weight:500;margin-left:2px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin-top:12px}
.bcard{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"rk lg nm v" "bar bar bar bar";gap:6px 10px;align-items:center;text-align:left;background:var(--ink-2);border:1px solid var(--rule);border-radius:var(--r);padding:8px 12px;color:var(--chalk);cursor:pointer}
.bcard:hover{border-color:var(--chalk-dim)}
.bc-rk{grid-area:rk;font-size:12px;color:var(--chalk-dim);font-variant-numeric:tabular-nums;min-width:16px}
.bc-nm{grid-area:nm;font-weight:650;font-size:14px;line-height:1.25;overflow-wrap:break-word}
.bc-nm small{display:block;font-size:11.5px;font-weight:400;color:var(--chalk-dim);overflow:hidden;text-overflow:ellipsis}
.bc-v{grid-area:v;text-align:right;font-size:13px;white-space:nowrap}
.bc-v .n{display:block;font-size:11px;color:var(--chalk-dim);font-weight:400;margin-top:1px}.bc-v .v{font-weight:700;font-size:14px}
@media (max-width:640px){.bc-v .n{display:inline;margin-left:4px}}
.bc-logo{grid-area:lg;width:34px;height:34px;border-radius:8px;background:var(--chalk);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:-.02em;overflow:hidden}
.bc-logo.sm{font-size:10px}
.trend{position:relative}
.trend .thit{cursor:crosshair}
.trend.rf .thit{cursor:pointer}
.rbar{transition:opacity .12s}.rbar.lostbar{opacity:.4}
.trend.rf.on .rbar{opacity:.25}.trend.rf.on .rbar.hl{opacity:1}.trend.rf.on .rbar.lostbar.hl{opacity:.5}

const S = {lang:"fr", view:"accueil", sector:"banking", conn:"need", eng:"all", lng:"all", min:1, sel:null, fs:false, src:"cited", bSort:"pct",

const SI = () => RD() ? 8 : 5;
const effEng = () => RD() ? 0 : S.eng;
const tx = k => (RD() && t()[k+"R"]!==undefined) ? t()[k+"R"] : t()[k];
D.brands.forEach(b=>{ b.dset = new Set(); D.domains.forEach((d,i)=>{ if(b.domains.some(x=>d===x||d.endsWith("."+x))) b.dset.add(i); }); });
const nf = (x,dec=0) => new Intl.NumberFormat(S.lang==="fr"?"fr-FR":"en-GB",{maximumFractionDigits:dec,minimumFractionDigits:dec}).format(x);
const pctTxt = (k,n) => { const fr=S.lang==="fr", v=100*k/n, u=fr?" %":"%"; if(k>0&&v<0.5) return (fr?"< 1":"<1")+u; if(k<n&&v>=99.5) return (fr?"> 99":">99")+u; return nf(v)+u; };
function val(k,n,o={}){
  const nTxt = o.bare ? "" : `<span class="n">${o.short?`(${nf(k)}/${nf(n)})`:t().ofN(nf(n))}</span>`;

}
const pv = (k,n) => !n ? "–" : pctTxt(k,n);
function scopeTxt(n){ const x=t(); return x.scope(nf(n), x.sectorOf[S.sector], effEng()==="all"?x.engAll:engName(effEng()), S.lng==="all"?x.lngAll:x.lngOnly[S.lng], D.dates.length); }

/* ---------- data helpers ---------- */
function ans(sec, eng="all", lng="all"){
  return D.answers.filter(a => D.prompts[a[3]].sector===sec && (eng==="all"||a[1]===eng) && (lng==="all"||a[2]===lng));
}
function stats(b, A){
  let named=0, first=0, cited=0, retr=0, nG=0;
  for(const a of A){
    if(a[4].includes(b.i)) named++;
    if(a[4][0]===b.i) first++;
    if(a[5].some(d=>b.dset.has(d))) cited++;
    if(a[1]===0){ nG++; if(a[6].some(d=>b.dset.has(d))) retr++; }
  }
  return {n:A.length, named, first, cited, retr, nG};
}
const sectorBrands = sec => D.brands.filter(b=>b.sector===sec);
const sectorPrompts = sec => D.prompts.filter(p=>p.sector===sec);

/* ---------- home ---------- */
function caseFiles(){
  const c = t().cases;
  // evidence targets: open Explore with the right filters and selection
  const needLead = () => { const A=ans("banking"); let best=null; sectorPrompts("banking").forEach(p=>{ const An=A.filter(a=>a[3]===p.i);
      sectorBrands("banking").forEach(b=>{ const k=An.filter(a=>a[4].includes(b.i)).length; if(An.length && (!best||k/An.length>best.v)) best={v:k/An.length,id:"n"+p.i}; }); }); return best?.id||null; };
  const rnnTop = () => { const L=readNN(); const r=(L.filter(x=>x.k/x.n>=0.8).sort((u,v)=>v.k-u.k)[0])||L[0]; if(!r) return {};
      const cnt={}; ans(r.b.sector,0).forEach(a=>a[6].forEach(d=>{ if(r.b.dset.has(d)) cnt[d]=(cnt[d]||0)+1; }));
      const d=Object.entries(cnt).sort((u,v)=>v[1]-u[1])[0]; return {sector:r.b.sector, sel:d?"d"+d[0]:"b"+r.b.i}; };
  const ownLow = () => { const rows=[]; D.brands.forEach(b=>{ if(!b.dset.size) return; const N=D.answers.filter(a=>a[4].includes(b.i)); if(N.length<100) return;
      rows.push({b,v:N.filter(a=>a[5].some(d=>b.dset.has(d))).length/N.length}); }); rows.sort((u,v)=>u.v-v.v); return rows[0]?{sector:rows[0].b.sector, sel:"b"+rows[0].b.i}:{}; };
  return [
    {k:"lang", tag:t().sector.banking, ...c.lang, chart:()=>cmpChart("banking","lang","named",0,{pick:"gapmix",eng:"all",noEx:true}),
      go:()=>({sector:"banking", conn:"need", cmp:"lang", cmpM:"named", cmpNeed:"all", cmpSort:"gap", jump:"compare"})},
    {k:"eng", tag:t().sector.electronics, ...c.eng, chart:()=>cmpChart("electronics","eng","named",0,{pick:"gapmix",lng:"all",noEx:true}),
      go:()=>({sector:"electronics", conn:"need", cmp:"eng", cmpM:"named", cmpNeed:"all", cmpSort:"gap", jump:"compare"})},
    {k:"need", tag:t().sector.banking, ...c.need, chart:()=>needLeadChart("banking"),
      go:()=>({jump:"bwrap", sector:"banking", conn:"need", sel:needLead(), bSort:"sel"})},
    {k:"readnn", tag:"ChatGPT", ...c.readnn, chart:readNNChart,
      go:()=>({jump:"bwrap", conn:"domain", src:"read", bSort:"sel", ...rnnTop()})},
    {k:"offi", tag:"ChatGPT, Gemini", ...c.offi, chart:officialChart,
      go:()=>({jump:"bwrap", sector:"banking", conn:"domain", src:"cited", eng:1})},
    {k:"ownsite", tag:t().allSectors, ...c.ownsite, chart:ownSiteChart,
      go:()=>({jump:"bwrap", conn:"domain", src:"cited", bSort:"sel", ...ownLow()})},
    {k:"third", tag:t().sector.delivery, ...c.third, chart:()=>thirdChart("delivery"),
      go:()=>({jump:"bwrap", sector:"delivery", conn:"domain", src:"cited"})},
  ];
}
const barList = (rows, cap) => `<div class="rnn">${rows.map(r=>`<div class="rnn-row"><span class="rnn-nm">${esc(r.l)}${r.sub?`<small>${esc(r.sub)}</small>`:""}</span><span class="rnn-bar"><i style="width:${r.n?100*r.k/r.n:0}%"></i></span><span class="rnn-v"><b>${pctTxt(r.k,r.n)}</b> <small>(${r.k}/${r.n})</small></span></div>`).join("")}</div>${cap?`<p class="cap">${cap}</p>`:""}`;
function needLeadChart(sec){ const A=ans(sec), best={};
  sectorPrompts(sec).forEach(p=>{ const An=A.filter(a=>a[3]===p.i); let top=null;
    sectorBrands(sec).forEach(b=>{ const k=An.filter(a=>a[4].includes(b.i)).length; if(!top||k>top.k) top={b,k,n:An.length,p}; });
    if(top && (!best[top.b.i] || top.k/top.n>best[top.b.i].k/best[top.b.i].n)) best[top.b.i]=top; });
  const rows=Object.values(best).sort((u,v)=>v.k/v.n-u.k/u.n).slice(0,6).map(r=>({l:needName(r.p),sub:r.b.name,k:r.k,n:r.n}));
  return barList(rows, t().capNeed); }
function officialChart(){ const off=new Set(); D.brands.forEach(b=>b.dset.forEach(d=>off.add(d)));
  const rows=[0,1].map(e=>{ const c=D.answers.filter(a=>a[1]===e).flatMap(a=>a[5]); return {l:engName(e), k:c.filter(d=>off.has(d)).length, n:c.length}; });
  return barList(rows, t().capOffi); }
function ownSiteChart(){ const rows=[];
  D.brands.forEach(b=>{ if(!b.dset.size) return; const N=D.answers.filter(a=>a[4].includes(b.i)); if(N.length<100) return;
    rows.push({l:b.name, sub:t().sector[b.sector], k:N.filter(a=>a[5].some(d=>b.dset.has(d))).length, n:N.length}); });
  rows.sort((u,v)=>u.k/u.n-v.k/v.n); const pick=[...rows.slice(0,4), ...rows.slice(-2)];
  return barList(pick, t().capOwn); }
function thirdChart(sec){ const A=ans(sec), off=new Set(); sectorBrands(sec).forEach(b=>b.dset.forEach(d=>off.add(d)));
  const c={}; A.forEach(a=>new Set(a[5]).forEach(d=>c[d]=(c[d]||0)+1));
  const rows=Object.entries(c).sort((u,v)=>v[1]-u[1]).slice(0,6).map(([d,k])=>({l:D.domains[d], sub:off.has(+d)?t().official:t().thirdParty, k, n:A.length}));

function runSearch(input){

  box.hidden=false;
  if(!hits.length){ box.innerHTML = `<div style="padding:12px 14px">${t().noRes}</div>`; return; }
  box.innerHTML = hits.slice(0,10).map(h=>`<button type="button" data-brand="${h.b.slug}"><span><b>${esc(h.b.name)}</b> <small>${t().sector[h.b.sector]}</small></span><small>${t().openSheet}</small></button>`).join("");
}

/* charts on paper */
function cmpChart(sec, mode, m, limit, opts={}){
  const isLang = mode==="lang", x=t(), fr=S.lang==="fr";
  const nf_ = A => (opts.need===undefined||opts.need==="all") ? A : A.filter(x=>x[3]===opts.need);
  const a0 = nf_(isLang ? ans(sec, S_eng(opts), 0) : ans(sec, 0, S_lng(opts)));
  const a1 = nf_(isLang ? ans(sec, S_eng(opts), 1) : ans(sec, 1, S_lng(opts)));
  let rows = sectorBrands(sec).map(b=>({b, p:stats(b,a0), q:stats(b,a1)})).filter(r=>r.p[m]+r.q[m]>0);
  const fr_ = s => s.n ? s[m]/s.n : 0, pr_ = s => s.n ? Math.round(100*s[m]/s.n) : 0;
  rows.sort((u,v)=> opts.sort==="gap"
    ? (Math.abs(pr_(v.p)-pr_(v.q))-Math.abs(pr_(u.p)-pr_(u.q))) || ((fr_(v.p)+fr_(v.q))-(fr_(u.p)+fr_(u.q)))
    : (fr_(v.p)+fr_(v.q))-(fr_(u.p)+fr_(u.q)));
  if(opts.pick==="gapmix"){ const G=r=>pr_(r.p)-pr_(r.q);
    const frL=rows.filter(r=>G(r)>5).sort((u,v)=>G(v)-G(u)).slice(0,3), arL=rows.filter(r=>G(r)<-5).sort((u,v)=>G(u)-G(v)).slice(0,3);
    const eq=rows.filter(r=>Math.abs(G(r))<=2).slice(0,2);
    rows=[...frL,...eq,...arL.reverse()]; }
  if(limit) rows = rows.slice(0,limit);
  const c0 = isLang?"var(--fr-d)":"var(--gpt-d)", c1 = isLang?"var(--ar-d)":"var(--gem-d)";
  const l0 = isLang?lngName(0):"ChatGPT", l1 = isLang?lngName(1):"Gemini";
  const w0 = isLang?(fr?"en français":"in French"):(fr?"sur ChatGPT":"on ChatGPT"), w1 = isLang?(fr?"en arabe":"in Arabic"):(fr?"sur Gemini":"on Gemini");
  const P = s => Math.round(100*s[m]/s.n);
  const verb = m==="first" ? (fr?"nommée en premier dans":"named first in") : (fr?"nommée dans":"named in");

function buildGraph(){
  const sec=S.sector, A=ans(sec,effEng(),S.lng), brands=sectorBrands(sec);
  const bs = brands.map(b=>({b, s:stats(b,A)})).sort((x,y)=>y.s.named-x.s.named);
  if(S.conn==="need"){
    const needs = sectorPrompts(sec);
    const edges=[], nN={};
    needs.forEach(p=>{ const An=A.filter(a=>a[3]===p.i); nN[p.i]=An.length;
      bs.forEach(({b})=>{ const k=An.filter(a=>a[4].includes(b.i)).length; if(k) edges.push({a:"n"+p.i, b:"b"+b.i, k, n:An.length}); }); });
    return {left:needs.map(p=>({id:"n"+p.i, label:needName(p), sub:t().nAns(nN[p.i])})),
            right:bs.map(({b,s})=>({id:"b"+b.i, label:b.name, sub:s.n>0?pctTxt(s.named,s.n):""})), edges, A, bs};
  }
  if(S.conn==="domain"){
    const cnt={}; A.forEach(a=>a[SI()].forEach(d=>cnt[d]=(cnt[d]||0)+1));
    const top = Object.entries(cnt).sort((x,y)=>y[1]-x[1]).slice(0,14).map(([d,k])=>({d:+d,k}));
    if(S.sel && S.sel[0]==="d"){ const di=+S.sel.slice(1); if(!top.some(x=>x.d===di) && cnt[di]) top.push({d:di,k:cnt[di]}); }
    const edges=[];
    bs.forEach(({b})=>top.forEach(({d})=>{ const k=A.filter(a=>a[4].includes(b.i)&&a[SI()].includes(d)).length; if(k) edges.push({a:"b"+b.i,b:"d"+d,k,n:A.length}); }));
    const owner = d => brands.find(b=>b.dset.has(d));
    return {left:bs.map(({b,s})=>({id:"b"+b.i,label:b.name,sub:s.n>0?pctTxt(s.named,s.n):""})),
            right:top.map(({d,k})=>({id:"d"+d,label:D.domains[d],sub:pctTxt(k,A.length),off:owner(d)})), edges, A, bs};
  }
  // pair
  const edges=[];
  for(let i=0;i<bs.length;i++) for(let j=i+1;j<bs.length;j++){
    const k=A.filter(a=>a[4].includes(bs[i].b.i)&&a[4].includes(bs[j].b.i)).length;
    if(k) edges.push({a:"b"+bs[i].b.i,b:"b"+bs[j].b.i,k,n:A.length,i,j});
  }
  return {nodes:bs.map(({b,s})=>({id:"b"+b.i,label:b.name,sub:s.n>0?pctTxt(s.named,s.n):""})), edges, A, bs, pair:true};
}

function wrapPx(s, maxPx, px=13.5, wt=700){
  // wrap by measured width (bold, so a selected label still fits); long single words break at . - / or by letter
  const fits = x => textW(x,px,wt) <= maxPx, out=[]; let cur="";
  const pieces=[]; s.split(" ").forEach(w=>{ if(fits(w)){ pieces.push(w); return; }
    let part=""; for(const ch of w){ if(part && !fits(part+ch)){ pieces.push(part+"\u00AD"); part=ch; } else part+=ch; } if(part) pieces.push(part); });
  pieces.forEach(x=>{ const glue = cur.endsWith("\u00AD") ? "" : " "; const nx = cur ? cur+glue+x : x;
    if(cur && !fits(nx.replace(/\u00AD/g,""))){ out.push(cur); cur=x; } else cur=nx; });
  if(cur) out.push(cur);
  return out.map(l=>l.endsWith("\u00AD")?l.slice(0,-1)+"-":l.replace(/\u00AD/g,""));
}
function wrapText(s, max){
  const w=s.split(" "), out=[]; let cur="";
  w.forEach(x=>{ if((cur+" "+x).trim().length>max && cur){ out.push(cur); cur=x; } else cur=(cur+" "+x).trim(); });
  if(cur) out.push(cur); return out.slice(0,3).map((l,i,arr)=> i===2 && out.length>3 ? l+"…" : l);
}

    const rows = Math.max(G.left.length, G.right.length), rh = fit?Math.max(16,(availH-64)/rows):narrow?52:Math.max(36, Math.min(52, Math.floor((window.innerHeight-200)/rows))), hdr=40, H = rows*rh+24+hdr;

      ${G.left.map(n=>nodeG(n,pos[n.id][0],pos[n.id][1],"end",narrow?wrapPx(n.label,lw-14):wrapText(n.label,lchars))).join("")}

function refusalChart(){
  const dates=D.dates, W=Math.max(300, Math.min(1170, document.documentElement.clientWidth-80)), H=190+(W<560?14:0), lw=30, top=24+(W<560?14:0), bh=H-top-22, cw=(W-lw)/D.meta.days;

  const Y=v=>top+bh-bh*v/mx;
  let bars="", hits="";
  const fmtD = iso => new Intl.DateTimeFormat(S.lang==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"short"}).format(new Date(iso+"T12:00:00"));
  for(let d=0; d<D.meta.days; d++){
    const date=dates[d]; const x=lw+d*cw;

    ["chatgpt","gemini"].forEach((e,j)=>{ const r=by[date+e]; if(!r) return; const bx=x+1+j*(cw-2)/2, bw=(cw-2)/2-1;

      const id=`${d}-${j}`;
      bars+=`<rect class="rbar" data-rb="${id}" x="${bx}" y="${Y(r.refusals)}" width="${bw}" height="${top+bh-Y(r.refusals)}" fill="${c}"/>`;
      if(r.lost) bars+=`<rect class="rbar lostbar" data-rb="${id}" x="${bx}" y="${Y(r.refusals+r.lost)}" width="${bw}" height="${Y(r.refusals)-Y(r.refusals+r.lost)}" fill="${c}"/>`;
      const lab = e==="chatgpt"?"ChatGPT":"Gemini", sw = e==="chatgpt"?"#2EE6A6":"#F472D0";
      const tip = `<b>${S.lang==="fr"?"Jour":"Day"} ${d+1} · ${fmtD(date)}</b><span><i style="background:${sw}"></i>${lab}</span><span>${t().refL1(r.refusals)}</span><span>${t().refL2(r.lost)}</span><em>${t().refL3(r.answers)}</em>`;
      hits+=`<rect class="thit" data-rb="${id}" data-tip="${esc(tip)}" x="${bx}" y="${top}" width="${bw+1}" height="${bh}" fill="transparent"/>`;
    });
  }

   <g font-size="11.5" font-weight="600"><circle cx="${lw+6}" cy="9" r="5" fill="var(--gpt-d)"/><text x="${lw+15}" y="13" fill="var(--paper-ink)">ChatGPT</text><circle cx="${lw+86}" cy="9" r="5" fill="var(--gem-d)"/><text x="${lw+95}" y="13" fill="var(--paper-ink)">Gemini</text><text x="${W<560?lw:lw+160}" y="${W<560?29:13}" fill="var(--paper-dim)" font-weight="400">${t().refus}, ${S.lang==="fr"?"teinte claire":"light shade"} = ${t().lost}</text></g>
   ${ticks.map(v=>`<line x1="${lw}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--paper-2)"/><text x="${lw-6}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--paper-dim)">${v}</text>`).join("")}
   ${bars}
   ${[1,7,14,21,28].map(d=>`<text x="${lw+(d-0.5)*cw}" y="${H-4}" text-anchor="middle" font-size="10.5" fill="var(--paper-dim)">${S.lang==="fr"?"J":"D"}${d}</text>`).join("")}

    <div class="ptabs">${[[0,0],[0,1],[1,0],[1,1]].map(([e,l])=>`<button type="button" data-combo="${e}-${l}" aria-pressed="${S.combo===e+"-"+l}">${engName(e)} ${l===0?"FR":"AR"}</button>`).join("")}</div>
    ${dayGrid(b)}
    <div class="gd-key"><span><i style="background:var(--mark)"></i>${x.kFirst}</span><span><i style="background:#B9C4CB"></i>${x.kNamed}</span><span><i style="background:var(--paper-2)"></i>${x.kNot}</span><span><i class="gd-c miss" style="height:12px"></i>${x.kMiss}</span><span><i style="outline:1px dashed #b9c0b6;outline-offset:-1px"></i>${x.kFut}</span></div>
    <h3>${x.domH}</h3>
    <table class="domains-t"><thead><tr><th>${x.domain}</th><th class="r">${x.cited}</th><th class="r">${x.read}</th></tr></thead><tbody>
    ${b.domains.map(d=>{ const idx=[...b.dset].filter(i=>D.domains[i]===d||D.domains[i].endsWith("."+d)); const A=ans(sec), G=A.filter(a=>a[1]===0);
      const c=A.filter(a=>a[5].some(i=>idx.includes(i))).length, r=G.filter(a=>a[6].some(i=>idx.includes(i))).length;
      return `<tr><td>${esc(d)}</td><td class="r">${val(c,A.length,{noTag:true})}</td><td class="r">${val(r,G.length,{noTag:true})}</td></tr>`;}).join("")}
    </tbody></table>
    <p class="note">${x.domNote}</p>
  </aside>`;
  document.body.style.overflow="hidden";
  if(oldP){ const np=ov.querySelector(".panel"); if(np){ np.style.animation="none"; ov.querySelector(".scrim")?.style.setProperty("animation","none"); np.scrollTop=keepTop; } }
}
function trendChart(b){
  const sec=b.sector, W=PCW(), H=220, lw=34, top=14, bot=24, ph=H-top-bot, cw=(W-lw-8)/(D.meta.days-1);
  const X=d=>lw+d*cw, Y=v=>top+ph*(1-v);
  const pts = D.dates.map((date,d)=>{ const A=D.answers.filter(a=>a[0]===d && D.prompts[a[3]].sector===sec); const s=stats(b,A); const nR=A.filter(a=>a[7]===1 && a[4].length===0).length; return {d, n:s.n, nR, kN:s.named, kF:s.first, named:s.n?s.named/s.n:0, first:s.n?s.first/s.n:0}; });
  const line=(k,c)=>{ const ok=pts.filter(p=>p.n>0); if(!ok.length) return "";
    const path=ok.map((p,i)=>`${i?"L":"M"}${X(p.d)} ${Y(p[k])}`).join(" ");
    return `<path d="${path}" fill="none" stroke="${c}" stroke-width="2"/>`+ok.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p[k])}" r="3.5" fill="${c}" stroke="${c}" stroke-width="1.6" data-tdot="${p.d}"/>`).join(""); };
  const fmtD = iso => new Intl.DateTimeFormat(S.lang==="fr"?"fr-FR":"en-GB",{day:"numeric",month:"short"}).format(new Date(iso+"T12:00:00"));
  const tip = p => `<b>${S.lang==="fr"?"Jour":"Day"} ${p.d+1} · ${fmtD(D.dates[p.d])}</b><span><i style="background:var(--s-named)"></i>${t().mNamed} : ${pctTxt(p.kN,p.n)} (${p.kN}/${p.n})</span><span><i style="background:var(--s-first)"></i>${t().mFirst} : ${pctTxt(p.kF,p.n)} (${p.kF}/${p.n})</span>${p.nR?`<em>${t().refTip(p.nR)}</em>`:""}`;
  const hits = pts.filter(p=>p.n>0).map(p=>`<rect class="thit" data-td="${p.d}" data-tip="${esc(tip(p))}" x="${X(p.d)-cw/2}" y="${top}" width="${cw}" height="${ph}" fill="transparent"/>`).join("");
  const fut = D.meta.days - D.dates.length;
  return `<div class="trend"><svg viewBox="0 0 ${W} ${H}" width="${W}" role="img">
    ${fut>0?`<rect x="${X(D.dates.length-0.5)}" y="${top}" width="${X(D.meta.days-1)-X(D.dates.length-0.5)+4}" height="${ph}" fill="var(--paper-2)" opacity=".55"/><text x="${(X(D.dates.length-0.5)+X(D.meta.days-1))/2}" y="${top+ph/2}" text-anchor="middle" font-size="11.5" fill="var(--paper-dim)">${t().future}</text>`:""}
    ${[0,.5,1].map(v=>`<line x1="${lw}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--paper-2)"/><text x="${lw-6}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--paper-dim)">${nf(v*100)}%</text>`).join("")}
    ${[1,7,14,21,28].map(d=>`<text x="${X(d-1)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--paper-dim)">${S.lang==="fr"?"J":"D"}${d}</text>`).join("")}
    <line class="tguide" x1="0" x2="0" y1="${top}" y2="${top+ph}" stroke="var(--paper-dim)" stroke-dasharray="3 3" visibility="hidden"/>
    ${line("named","var(--s-named)")}${line("first","var(--s-first)")}
    ${hits}
  </svg><div class="ttip" hidden></div></div>
  <div class="gd-key" style="margin-top:4px"><span><i style="background:var(--s-named);height:3px"></i>${t().mNamed}</span><span><i style="background:var(--s-first);height:3px"></i>${t().mFirst}</span></div>`;
}
function dayGrid(b){
  const [e,l]=S.combo.split("-").map(Number), sec=b.sector;
  const map={}; D.answers.forEach(a=>{ if(a[1]===e&&a[2]===l&&D.prompts[a[3]].sector===sec) map[a[0]+"-"+a[3]]=a; });
  return `<div class="grid-days">${sectorPrompts(sec).map(p=>`<div class="gd-row">
    <div class="need">${esc(needName(p))}</div>
    <details class="pdetails"><summary>${t().showPrompt}</summary><div style="margin-top:4px;font-size:14px" ${l===1?'class="ar-block"':""}>${l===1?`<span lang="ar" dir="rtl">${esc(p.ar)}</span>`:esc(p.fr)}</div></details>
    <div class="gd-cells">${Array.from({length:D.meta.days},(_,d)=>{
      if(d>=D.dates.length) return `<div class="gd-c future"></div>`;
      const a=map[d+"-"+p.i]; if(!a) return `<div class="gd-c miss" title="${S.lang==="fr"?"Jour":"Day"} ${d+1}"></div>`;
      const r=a[4].indexOf(b.i); if(r<0) return `<div class="gd-c" title="${S.lang==="fr"?"Jour":"Day"} ${d+1}"></div>`;
      return `<div class="gd-c ${r===0?"first":"named"}" title="${S.lang==="fr"?"Jour":"Day"} ${d+1}, rang ${r+1}">${r+1}</div>`;
    }).join("")}</div></div>`).join("")}</div>`;
}

/* ---------- routing and events ---------- */
function route(){
  const h = location.hash.slice(1) || "accueil";
  const m = h.match(/^marque-(.+)$/);
  if(m){ if(!S.view) S.view="marques"; openPanel(m[1]); render(false); return; }
  S.brand=null; renderPanel();
  if(h.startsWith("explorer-") && SECTORS.includes(h.slice(9))){ if(S.sector!==h.slice(9)) S.sel=null; S.sector=h.slice(9); S.view="explorer"; }
  else if(["accueil","marques","methode"].includes(h)) S.view=h;
  else S.view="accueil";
  render(true);
}
let lastView=null;
function playBoard(cls, ms){ const b=document.getElementById("board"); if(!b) return; b.classList.remove(cls); void b.offsetWidth; b.classList.add(cls); clearTimeout(b["_"+cls]); b["_"+cls]=setTimeout(()=>b.classList.remove(cls), ms); }
function setFs(on){
  S.fs=on;
  try{ if(on && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
       if(!on && document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){}
  render(false);
}
document.addEventListener("fullscreenchange", ()=>{ if(!document.fullscreenElement && S.fs){ S.fs=false; render(false); } });
function render(scroll){
  if(S.view!=="explorer") S.fs=false;
  document.documentElement.classList.toggle("fs-on", S.fs);
  shell();
  const app=document.getElementById("app");
  app.innerHTML = S.view==="explorer"?viewExplorer():S.view==="marques"?viewBrands():S.view==="methode"?viewMethod():viewHome();
  if(S.view==="explorer") renderBoard();
  if(scroll && lastView!==S.view+S.sector) window.scrollTo(0,0);
  lastView=S.view+S.sector;
  if(S.jump){ const id=S.jump; S.jump=null;
    setTimeout(()=>{ const el=document.getElementById(id); if(!el) return; const y=el.getBoundingClientRect().top+scrollY-80; window.scrollTo({top:Math.max(0,y),behavior:"smooth"});
      if(id==="bwrap"){ document.getElementById("board")?.classList.remove("draw"); if(!S.sel) setTimeout(()=>playBoard("draw",1100),550); } },60); }
}
function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); }

document.addEventListener("click", ev=>{
  const q = s => ev.target.closest(s);
  let el;
  if(el=q("[data-lang]")){ S.lang=el.dataset.lang; try{localStorage.setItem("dia-lang",S.lang);}catch(e){} render(false); if(S.brand) renderPanel(); return; }
  if(el=q("[data-brand]")){ ev.preventDefault(); location.hash="marque-"+el.dataset.brand; return; }
  if(el=q("[data-close]")){ S.brand=null; renderPanel(); const back = S.view==="explorer"?"explorer-"+S.sector:S.view; history.replaceState(null,"","#"+back); return; }
  if(el=q("[data-share]")){ const url=location.href; const done=()=>toast(t().copied);
    try{ navigator.clipboard.writeText(url).then(done,()=>toast(url)); }catch(e){ toast(url); } return; }
  if(el=q(".thit")){ if(Date.now()-scrubEnd>400) trendTip(el); return; }
  if(el=q("[data-pm]")){ S.pm=el.dataset.pm; renderPanel(true); return; }
  if(el=q("[data-combo]")){ S.combo=el.dataset.combo; renderPanel(true); return; }
  if(el=q("[data-casei]")){ S.caseI=+el.dataset.casei; render(false); return; }
  if(el=q("[data-case]")){ const f=caseFiles()[+el.dataset.case]; Object.assign(S,{eng:"all",lng:"all",sel:null,hov:null,bSort:"pct",src:"cited",fs:false,cmp:"lang",cmpM:"named",cmpSort:"pct",cmpNeed:"all"},f.go()); return; }
  if(el=q("[data-set]")){ const k=el.dataset.set; let v=el.dataset.val; if(v!=="all"&&!isNaN(+v)) v=+v; S[k]=v; if(k==="conn"||k==="src"){ S.sel=null; S.hov=null; } render(false); return; }
  if(el=q("[data-dd-toggle]")){ const d=el.closest(".dd"), open=!d.classList.contains("open"); document.querySelectorAll(".dd.open").forEach(x=>{x.classList.remove("open");x.querySelector(".dd-btn").setAttribute("aria-expanded","false");}); if(open){ d.classList.add("open"); el.setAttribute("aria-expanded","true"); d.querySelector('[aria-selected="true"]')?.focus(); } return; }
  if(el=q("[data-cmpneed-v]")){ const v=el.dataset.cmpneedV; S.cmpNeed = v==="all"?"all":+v; render(false); document.querySelector("#cmpdd .dd-btn")?.focus(); return; }
  if(!q(".dd")) document.querySelectorAll(".dd.open").forEach(x=>{x.classList.remove("open");x.querySelector(".dd-btn").setAttribute("aria-expanded","false");});
  if(el=q("[data-fs]")){ setFs(!S.fs); return; }
  if(el=q("[data-jump]")){ document.getElementById("side")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(el=q("[data-clear]")){ S.sel=null; renderBoard(); return; }
  if(el=q("[data-node]")){ S.sel = S.sel===el.dataset.node?null:el.dataset.node; renderBoard();
    if(S.sel && window.innerWidth<1000 && !S.fs){ const sd=document.getElementById("side"); if(sd){ const y=sd.getBoundingClientRect().top+scrollY-72; window.scrollTo({top:Math.max(0,y),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); } }
    return; }
  if(!q(".search")) document.querySelectorAll(".results").forEach(r=>r.hidden=true);
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Escape" && document.querySelector(".dd.open")){ const d=document.querySelector(".dd.open"); d.classList.remove("open"); d.querySelector(".dd-btn").focus(); return; }
  if((ev.key==="ArrowDown"||ev.key==="ArrowUp") && ev.target.matches?.(".dd-menu [role=option]")){ ev.preventDefault(); const all=[...ev.target.parentElement.children], i=all.indexOf(ev.target); all[Math.max(0,Math.min(all.length-1,i+(ev.key==="ArrowDown"?1:-1)))].focus(); }
  if(ev.key==="Escape" && S.fs && !S.brand){ setFs(false); return; }
  if(ev.key==="Escape" && S.brand){ document.querySelector("[data-close]")?.click(); }
  if((ev.key==="Enter"||ev.key===" ") && ev.target.matches?.("[data-node]")){ ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); }
});
document.addEventListener("change", ev=>{ if(ev.target.matches?.("[data-cmpneed]")){ const v=ev.target.value; S.cmpNeed = v==="all"?"all":+v; render(false); } });
document.addEventListener("input", ev=>{ if(ev.target.matches("[data-search]")) runSearch(ev.target); });
let rz; window.addEventListener("resize", ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ render(false); if(S.brand) renderPanel(true); },150); });
const canHover = window.matchMedia("(hover: hover)").matches;
function hover(id){
  if(S.view==="explorer" && (S.conn==="pair"||S.conn==="domain")){ const nh = id && (id[0]==="b"||(S.conn==="domain"&&id[0]==="d")) ? id : null; if(nh!==(S.hov||null)){ S.hov=nh; renderBoard(); } }
  const b=document.getElementById("board"); if(!b) return;
  b.querySelectorAll(".hov").forEach(x=>x.classList.remove("hov"));
  b.classList.toggle("has-hov", !!id);
  if(!id) return;
  const on=new Set([id]);
  b.querySelectorAll(".edge").forEach(p=>{ if(p.dataset.a===id||p.dataset.b===id){ p.classList.add("hov"); on.add(p.dataset.a); on.add(p.dataset.b); } });
  b.querySelectorAll(".node").forEach(n=>{ if(on.has(n.dataset.node)) n.classList.add("hov"); });
}
function trendTip(rect){
  const box=rect?.closest(".trend") || document.querySelector(".trend.on"); if(!box) return;
  const tt=box.querySelector(".ttip"), g=box.querySelector(".tguide");
  box.querySelectorAll("[data-tdot].on").forEach(c=>{c.classList.remove("on");c.setAttribute("r","3.5");});
  box.querySelectorAll(".rbar.hl").forEach(c=>c.classList.remove("hl"));
  if(!rect){ tt.hidden=true; g?.setAttribute("visibility","hidden"); box.classList.remove("on"); return; }
  const d=rect.dataset.td, x=+rect.getAttribute("x")+ +rect.getAttribute("width")/2;
  box.classList.add("on");
  if(d!==undefined) box.querySelectorAll(`[data-tdot="${d}"]`).forEach(c=>{c.classList.add("on");c.setAttribute("r","5.5");});
  if(rect.dataset.rb) box.querySelectorAll(`.rbar[data-rb="${rect.dataset.rb}"]`).forEach(c=>c.classList.add("hl"));
  if(g){ g.setAttribute("x1",x); g.setAttribute("x2",x); g.setAttribute("visibility","visible"); }
  tt.innerHTML=rect.dataset.tip; tt.hidden=false;
  const svg=box.querySelector("svg"), sc=svg.getBoundingClientRect().width/svg.viewBox.baseVal.width, px=x*sc;
  const w=tt.offsetWidth, bw=box.clientWidth; tt.style.left=(px+14+w<=bw ? px+14 : Math.max(0,px-14-w))+"px";
}
/* press and slide across a day chart to scrub; the tooltip follows the finger */
function hitAt(box, cx){ let best=null, bd=1e9;
  box.querySelectorAll(".thit").forEach(r=>{ const b=r.getBoundingClientRect(); const d = cx<b.left ? b.left-cx : cx>b.right ? cx-b.right : 0; if(d<bd){ bd=d; best=r; } });
  return best; }
let scrub=null;
document.addEventListener("pointerdown", ev=>{ const svg=ev.target.closest?.(".trend svg"); if(!svg) return;
  const box=svg.closest(".trend"); scrub={box, id:ev.pointerId, moved:false, x:ev.clientX, touch:ev.pointerType!=="mouse"};
  try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
  trendTip(hitAt(box, ev.clientX)); });
document.addEventListener("pointermove", ev=>{ if(!scrub || ev.pointerId!==scrub.id) return;
  if(Math.abs(ev.clientX-scrub.x)>4) scrub.moved=true;
  const r=hitAt(scrub.box, ev.clientX); if(r) trendTip(r); });
const endScrub = ev=>{ if(!scrub || ev.pointerId!==scrub.id) return; const s=scrub; scrub=null;
  // a slide hides the tip on release; a plain tap keeps it, like before
  if(s.moved && (s.touch || ev.type!=="pointerup")){ trendTip(null); scrubEnd=Date.now(); }
  else if(ev.type==="pointercancel") trendTip(null); };
let scrubEnd=0;
document.addEventListener("pointerup", endScrub);
document.addEventListener("pointercancel", endScrub);
document.addEventListener("mouseover", ev=>{ const r=ev.target.closest?.(".thit"); if(r) trendTip(r); else if(document.querySelector(".trend.on") && !ev.target.closest?.(".trend")) trendTip(null); });
document.addEventListener("mouseover", ev=>{ if(!canHover) return; const n=ev.target.closest?.("#board [data-node]"); hover(n?n.dataset.node:null); });
window.addEventListener("hashchange", route);
route();
</script>
